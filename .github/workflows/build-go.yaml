name: GO

on:
  pull_request:
    branches:
      - 'master'
  push:
    branches:
      - 'master'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: [ '1.27', 'stable' ]
    services:
      redis:
        image: redis:latest
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ matrix.go-version }}

      # Pin the job to the toolchain it selected. Without this, a version older
      # than the go directive in go.mod silently downloads a newer toolchain
      # and the matrix entry tests nothing.
      - name: Pin toolchain
        run: echo "GOTOOLCHAIN=local" >> $GITHUB_ENV

      - name: Install dependencies
        run: go get .
      - name: Test with Go
        run: go test ./...
      - name: Upload Go test results
        uses: actions/upload-artifact@v4
        with:
          name: Go-results-${{ matrix.go-version }}
          path: TestResults-${{ matrix.go-version }}.json
